<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f10" />
  <meta name="description" content="SSKR 2027 참가 안내와 참가자 전용 서비스를 확인하세요." />
  <base href="/participate/" />
  <title>SSKR 2027 참가</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/web/shared/account-control.css?v=patch-034" />
  <link rel="stylesheet" href="./styles.css?v=patch-057" />
  <link rel="stylesheet" href="/web/shared/auth/social-auth.css?v=patch-057">
</head>
<body>
  <a class="skip-link" href="#context-surface">참가 화면으로 바로가기</a>

  <main class="participate-page">
    <section class="event-panel" aria-labelledby="event-title">
      <div class="event-photo" aria-hidden="true"></div>
      <div class="event-shade" aria-hidden="true"></div>

      <header class="event-header">
        <a class="brand" href="/" aria-label="SSKR 홈으로 이동">
          <strong>SSKR</strong>
          <span>SUNRISE SUNSET<br />KOREAN RALLY</span>
        </a>
        <span class="season" id="event-season"></span>
      </header>

      <div class="event-copy">
        <div class="event-kicker">
          <span class="event-status" id="event-status"></span>
          <span id="event-category"></span>
        </div>

        <h1 id="event-title"><span id="event-title-line"></span><span id="event-subtitle"></span></h1>
        <p class="event-description" id="event-description"></p>

        <dl class="event-facts" id="event-facts"></dl>

        <div class="event-actions">
          <button class="primary-action" id="primary-action" type="button"><span>신청 계속하기</span><b aria-hidden="true">→</b></button>
        </div>
      </div>

      <p class="event-note">상세 일정과 제공 품목은 운영 상황에 따라 변경될 수 있습니다.</p>
    </section>

    <section class="service-panel" id="context-surface" aria-live="polite">
      <div class="participate-utilities" id="participate-utilities" hidden>
        <a class="participate-utility" href="/app/notices" aria-label="알림">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
          <span class="participate-notification-dot"></span>
        </a>
        <button class="participate-utility" id="participate-settings" type="button" aria-label="설정">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
        </button>
        <div class="participate-account-meta" id="participate-account-meta" hidden>
          <strong id="participate-account-name"></strong>
          <span id="participate-account-number"></span>
        </div>
        <div class="account-shell" id="account-shell"></div>
      </div>
      <section class="surface-view surface-view--loading is-active" id="mode-loading" data-surface-mode="MODE_LOADING" aria-label="참가 정보 불러오는 중">
        <div class="loading-column"><i aria-hidden="true"></i><p>참가 정보를 불러오고 있습니다.</p></div>
      </section>

      <div class="surface-view surface-view--review" id="mode-a" data-surface-mode="MODE_A" hidden>
        <div class="benefit-area">
          <header class="benefit-heading">
            <div>
              <h2 id="benefit-title">참가 혜택 &amp; 전용 서비스 <i aria-hidden="true"></i></h2>
              <p class="benefit-hint"><span aria-hidden="true">↗</span> 카드를 선택하면 상세 내용을 확인할 수 있습니다.</p>
            </div>
          </header>

          <div class="benefit-grid" id="benefit-grid"></div>
        </div>

        <section class="manager-area" id="manager" aria-labelledby="manager-title">
          <header class="manager-heading">
            <div>
              <h2 id="manager-title"></h2>
              <p id="manager-description"></p>
            </div>
            <span>참가 확정 후 이용 가능</span>
          </header>

          <ol class="manager-flow" id="manager-flow"></ol>
          <ul class="manager-promises" id="manager-promises"></ul>
        </section>
      </div>

      <section class="surface-view surface-view--auth" id="mode-auth" data-surface-mode="MODE_AUTH" aria-labelledby="auth-title" hidden>
        <div id="participate-social-auth" style="width:100%"></div>
      </section>

      <section class="surface-view surface-view--application" id="mode-b" data-surface-mode="MODE_B" hidden></section>
      <section class="surface-view surface-view--lobby" id="mode-c" data-surface-mode="MODE_C" hidden></section>
      <section class="surface-view surface-view--account" id="mode-account" data-surface-mode="MODE_ACCOUNT" hidden></section>
      <section class="surface-view surface-view--error" id="mode-error" data-surface-mode="MODE_ERROR" aria-labelledby="surface-error-title" hidden>
        <div class="error-column"><span aria-hidden="true">!</span><h2 id="surface-error-title" tabindex="-1">참가 정보를 불러오지 못했습니다.</h2><p id="surface-error-message">현재 상태를 다시 확인해 주세요.</p><button type="button" id="surface-retry">다시 시도</button></div>
      </section>
    </section>
  </main>

  <script src="./data.js?v=patch-031"></script>
  <script src="./mock-auth.js?v=patch-031"></script>
  <script src="./mock-session.js?v=patch-031-reset1"></script>
  <script src="./api-client.js?v=patch-031"></script>
  <script src="./step1-content.js?v=patch-031"></script>
  <script src="./mode-b.js?v=patch-034-flow"></script>
  <script src="./mode-c.js?v=patch-034-flow"></script>
  <script src="/web/shared/account-control.js?v=patch-034"></script>
  <script src="./account.js?v=patch-034-flow"></script>
  <script src="/web/shared/auth/social-auth.js?v=patch-057"></script>
  <script src="./app.js?v=patch-057"></script>
</body>
</html>
