name: Scene 05 B Three-Still Finale QA v3.8.4

on:
  push:
    branches:
      - feature/scene05-v384-three-still-finale
    paths:
      - '.github/workflows/scene05-b-v384.yml'
      - 'assets/scene05/finale_v384_stills/**'
      - 'assets/scene05/finale_v383_refs/**'
      - 'tools/scene05-b-matte-assets-v383.py'
      - 'tools/scene05-b-source-v383.py'
      - 'tools/scene05-b-source-v384.py'
      - 'final/scene05-b/**'
      - 'tools/scene05-b-source-v*.py'
      - 'tools/scene05-b-v37-*.py'
      - 'tools/scene05-b-v38-post.py'
      - 'tools/scene05-b-peninsula-*.py'
      - 'tools/scene05-b-surface-relief-v34.py'
      - 'tools/scene05-b-conform-relief-v34.py'
      - 'tools/scene05-b-participant-routes-v32.py'
      - 'tools/scene05-b-road-overlay-v31.py'
      - 'tools/scene05-b-choice-data-v29.py'
      - 'tools/scene05-b-art-textures-v22.py'
      - 'tools/scene05-final-*.py'
      - 'assets/scene05/worldcover_v1/**'
      - 'assets/scene05/choice_roads_source_v1.geojson'
      - 'assets/scene05/route_network_v0.1/**'
      - 'assets/scene05/south_korea_hero_v0.2/**'
      - 'assets/vector/korean_peninsula_precise.svg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scene05-b-v384:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow pyproj trimesh cairosvg

      - name: Build peninsula and route resources
        run: |
          python tools/scene05-final-terrain-v1.py
          python tools/scene05-b-art-textures-v22.py
          python tools/scene05-final-data-v1.py
          python tools/scene05-b-peninsula-texture-v33.py
          python tools/scene05-b-surface-relief-v34.py
          python tools/scene05-b-peninsula-texture-v36.py
          python tools/scene05-b-peninsula-coastfix-v36.py
          python tools/scene05-b-peninsula-surface-v38.py
          python tools/scene05-b-peninsula-surface-v381.py
          python tools/scene05-b-road-overlay-v31.py
          python tools/scene05-b-choice-data-v29.py
          python tools/scene05-b-participant-routes-v32.py
          python tools/scene05-b-conform-relief-v34.py

      - name: Fetch dawn environment and build inherited v3.8.3 assets
        run: |
          mkdir -p output/scene05_final_v1
          curl -fL --retry 3 --retry-delay 2 -A 'SSKR-Scene05/1.0' \
            'https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Tonemapped%20JPG/umhlanga_sunrise.jpg' \
            -o output/scene05_final_v1/polyhaven_umhlanga_sunrise.jpg
          python tools/scene05-b-matte-assets-v383.py
          test -s output/scene05_final_v1/sky_dawn_v381.jpg
          test -s output/scene05_final_v1/sky_sunset_env_v381.jpg
          test -s output/scene05_final_v1/cloud_veil_v381.png

      - name: Validate v3.8.4 still assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('assets/scene05/finale_v384_stills')
          names=['finale_still_01_v384.webp','finale_still_02_v384.webp','finale_still_03_v384.webp']
          for name in names:
              p=root/name
              assert p.stat().st_size > 10000, (name,p.stat().st_size)
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  assert im.width >= 700 and im.height >= 390, (name,im.size)
                  print(name, im.size, p.stat().st_size)
          PY

      - name: Generate Scene 05 B v3.8.4 runtime
        run: |
          python tools/scene05-b-source-v20.py
          python tools/scene05-b-coast-source-v22.py
          python tools/scene05-b-source-v23.py
          python tools/scene05-b-source-v24.py
          python tools/scene05-b-source-v25.py
          python tools/scene05-b-source-v251.py
          python tools/scene05-b-source-v252.py
          python tools/scene05-b-source-v26.py
          python tools/scene05-b-source-v27.py
          python tools/scene05-b-source-v28.py
          python tools/scene05-b-source-v29.py
          python tools/scene05-b-source-v30.py
          python tools/scene05-b-source-v31.py
          python tools/scene05-b-source-v32.py
          python tools/scene05-b-source-v33.py
          python tools/scene05-b-source-v34.py
          python tools/scene05-b-source-v35.py
          python tools/scene05-b-v35-framing-fix.py
          python tools/scene05-b-source-v36.py
          python tools/scene05-b-v36-evening-fix.py
          python tools/scene05-b-v37-prep.py
          python tools/scene05-b-source-v37.py
          python tools/scene05-b-v37-post.py
          python tools/scene05-b-source-v38.py
          python tools/scene05-b-v38-post.py
          python tools/scene05-b-source-v381.py
          python tools/scene05-b-source-v383.py
          python tools/scene05-b-source-v384.py
          test -s output/scene05-b-v384.js
          grep -q 'Scene 05 B v3.8.4' output/scene05-b-v384.js
          grep -q '__scene05V384State' output/scene05-b-v384.js
          grep -q 'finaleStillV384_3' output/scene05-b-v384.js
          grep -q 'sunSprite.visible = false' output/scene05-b-v384.js
          grep -q 'uReflectionStrength.value = 0.0' output/scene05-b-v384.js

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install fonts and JS dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          npm install --no-save --no-audit --no-fund three@0.185.1 gsap@3.15.0 esbuild puppeteer-core

      - name: Bundle v3.8.4
        run: |
          rm -rf final/scene05-b/dist
          mkdir -p final/scene05-b/dist/assets
          npx esbuild output/scene05-b-v384.js --bundle --format=esm --target=es2022 --minify --outfile=final/scene05-b/dist/app.js
          cp final/scene05-b/index.html final/scene05-b/dist/index.html
          cp final/scene05-b/scene05-b.css final/scene05-b/dist/scene05-b.css
          cp final/scene05-b/README.md final/scene05-b/dist/README.md
          cp output/scene05_final_v1/{terrain_final_uv.glb,terrain_dawn_final.png,terrain_day_final.png,terrain_sunset_final.png,coast_shallow.png,peninsula_surface_v381.png,peninsula_mask_debug_v381.png,peninsula_surface_v381_qa.json,peninsula_surface_v34.json,road_choice_overlay_v31.png,scene05_final_data_v1.json,sky_dawn_v381.jpg,sky_sunset_env_v381.jpg,cloud_veil_v381.png} final/scene05-b/dist/assets/
          cp assets/scene05/finale_v384_stills/finale_still_*_v384.webp final/scene05-b/dist/assets/
          cp assets/vector/korean_peninsula_precise.svg final/scene05-b/dist/assets/
          python final/scene05-b/pack_standalone.py
          test -s final/scene05-b/dist/SSKR_Scene05_B_30s_Journey_v3.8.4_standalone.html

      - name: Visual QA keyframes
        timeout-minutes: 6
        run: |
          python -m http.server 4174 --directory final/scene05-b/dist >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$BROWSER"
          timeout 320s xvfb-run -a env BROWSER_PATH="$BROWSER" node final/scene05-b/qa.mjs
          for f in \
            b384_015_peninsula b384_045_east_dawn b384_072_start_dawn b384_120_route_day b384_165_late_day \
            b384_189_finish_evening b384_210_finish_sunset b384_224_handoff_start b384_234_handoff_resolve \
            b384_244_still01_message b384_255_still01_to_02 b384_260_still02_hold b384_275_still02_to_03 \
            b384_281_still03_hold b384_295_final_hold b384_diag_surface_full b384_diag_surface_south \
            b384_diag_surface_east b384_diag_surface_west b384_diag_land_only b384_diag_land_ocean \
            b384_diag_texture_only b384_diag_canonical_mask; do
            test -s "final/scene05-b/dist/${f}.png"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: SSKR-Scene05-B-Three-Still-Finale-v3.8.4
          path: final/scene05-b/dist/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
