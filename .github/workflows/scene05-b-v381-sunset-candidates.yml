name: Scene 05 B v3.8.1 Sunset Candidates
on:
  workflow_dispatch:
  push:
    branches:
      - feature/scene05-v381-coast-sunset-matte
    paths:
      - '.github/workflows/scene05-b-v381-sunset-candidates.yml'
permissions: {contents: read}
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch CC0 coastal source panoramas
        run: |
          mkdir -p candidates/panos
          base='https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Tonemapped%20JPG'
          for a in small_harbour_sunset the_sky_is_on_fire umhlanga_sunrise cape_hill; do
            curl -fL --retry 3 --retry-delay 2 -A 'SSKR-Scene05/1.0' "$base/$a.jpg" -o "candidates/panos/$a.jpg"
          done
          ls -lh candidates/panos
      - name: Project each panorama around its photographed sun
        run: |
          python -m pip install numpy Pillow
          python - <<'PY'
          import math
          from pathlib import Path
          import numpy as np
          from PIL import Image, ImageDraw

          outdir=Path('candidates/projected'); outdir.mkdir(parents=True,exist_ok=True)

          def detect_sun(im):
              w,h=im.size
              sw=min(1600,w); sh=max(32,round(h*sw/w))
              a=np.asarray(im.resize((sw,sh),Image.Resampling.LANCZOS),np.float32)/255
              r,g,b=a[...,0],a[...,1],a[...,2]
              lum=.2126*r+.7152*g+.0722*b
              warm=np.clip(r-b*.64-g*.04,0,1)
              yy=np.linspace(0,1,sh)[:,None]
              score=lum*.55+warm*.65
              score=np.where((yy>.20)&(yy<.72),score,-1)
              sy,sx=np.unravel_index(int(np.argmax(score)),score.shape)
              return sx/max(sw-1,1)*w, sy/max(sh-1,1)*h

          def perspective(im,yaw,pitch,hfov,ow=1600,oh=900):
              src=np.asarray(im.convert('RGB'),np.float32)
              h,w=src.shape[:2]
              vfov=2*math.atan(math.tan(math.radians(hfov)/2)*(oh/ow))
              xs=np.linspace(-math.tan(math.radians(hfov)/2),math.tan(math.radians(hfov)/2),ow,dtype=np.float32)
              ys=np.linspace(math.tan(vfov/2),-math.tan(vfov/2),oh,dtype=np.float32)
              x,y=np.meshgrid(xs,ys); z=np.ones_like(x)
              n=np.sqrt(x*x+y*y+z*z); x/=n; y/=n; z/=n
              p=math.radians(pitch); cp,sp=math.cos(p),math.sin(p)
              y2=y*cp-z*sp; z2=y*sp+z*cp; y,z=y2,z2
              q=math.radians(yaw); cq,sq=math.cos(q),math.sin(q)
              x2=x*cq+z*sq; z2=-x*sq+z*cq; x,z=x2,z2
              lon=np.arctan2(x,z); lat=np.arcsin(np.clip(y,-1,1))
              u=(lon/(2*math.pi)+.5)*w; v=(.5-lat/math.pi)*h
              u=np.mod(u,w); v=np.clip(v,0,h-1.001)
              x0=np.floor(u).astype(np.int32); y0=np.floor(v).astype(np.int32)
              x1=(x0+1)%w; y1=np.minimum(y0+1,h-1)
              dx=(u-x0)[...,None]; dy=(v-y0)[...,None]
              a=src[y0,x0]*(1-dx)+src[y0,x1]*dx
              b=src[y1,x0]*(1-dx)+src[y1,x1]*dx
              dst=a*(1-dy)+b*dy
              return Image.fromarray(np.clip(dst,0,255).astype(np.uint8),'RGB')

          projected=[]
          for p in sorted(Path('candidates/panos').glob('*.jpg')):
              im=Image.open(p).convert('RGB')
              sx,sy=detect_sun(im); w,h=im.size
              yaw=(sx/w-.5)*360
              sun_lat=(.5-sy/h)*180
              # Put sun at about x=.42, y=.47: enough ocean below for reflection.
              for hfov in (76,92):
                  horiz=math.degrees(2*math.atan(math.tan(math.radians(hfov)/2)*(.42-.5)*2))
                  vfov=2*math.degrees(math.atan(math.tan(math.radians(hfov)/2)*(900/1600)))
                  vert=math.degrees(math.atan(math.tan(math.radians(vfov)/2)*(1-2*.47)))
                  view=perspective(im,yaw-horiz,sun_lat-vert,hfov)
                  fp=outdir/f'{p.stem}_fov{hfov}.jpg'
                  view.save(fp,quality=92,subsampling=1)
                  projected.append(fp)
                  print(p.stem,'sun',round(sx,1),round(sy,1),'yaw',round(yaw,2),'lat',round(sun_lat,2),'fov',hfov)

          tw,th=720,405; lh=38; cols=2; rows=(len(projected)+1)//2
          sheet=Image.new('RGB',(cols*tw,rows*(th+lh)),(16,16,16)); d=ImageDraw.Draw(sheet)
          for i,p in enumerate(projected):
              im=Image.open(p).resize((tw,th),Image.Resampling.LANCZOS)
              x=(i%2)*tw; y=(i//2)*(th+lh); sheet.paste(im,(x,y))
              d.text((x+10,y+th+9),p.stem,fill=(245,245,245))
          sheet.save('candidates/sunset_projection_contact.jpg',quality=92,subsampling=1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SSKR-Scene05-B-v381-Sunset-Candidates
          path: candidates/
          if-no-files-found: error
          compression-level: 4
          retention-days: 7
