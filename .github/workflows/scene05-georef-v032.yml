name: Scene 05 Georef Model Selection v0.3.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scene05-georef-v032.yml'
      - 'tools/scene05-georef-modelselect-v032.py'
      - 'assets/scene05/georef_v0.3.1/georef_diagnostic_v031.json'
      - 'assets/scene05/south_korea_hero_v0.2/svg_georef.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select-georef-model-v032:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install numpy pyproj opencv-python-headless

      - name: Compare projection models
        run: python tools/scene05-georef-modelselect-v032.py

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSKR-Scene05-Georef-ModelSelection-v0.3.2
          path: output/scene05_georef_v0.3.2/
          if-no-files-found: error
          retention-days: 30

      - name: Publish diagnostic result
        run: |
          mkdir -p assets/scene05/georef_v0.3.2
          cp output/scene05_georef_v0.3.2/georef_model_selection_v032.json assets/scene05/georef_v0.3.2/
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('assets/scene05/georef_v0.3.2/georef_model_selection_v032.json')
          d=json.loads(p.read_text('utf-8'));m=d['best_model_metrics']
          lines=[
              '# Scene 05 Georef Model Selection v0.3.2','',
              f"Decision: **{d['decision']}**",
              f"Best model: **{d['best_model']}**",'',
              f"- Inliers: **{m['inliers']} / 13**",
              f"- Leave-one-out mean: **{m['loo_error_km']['mean']:.3f} km**",
              f"- Leave-one-out max: **{m['loo_error_km']['max']:.3f} km**",'',
              'This test compares global map projections + affine placement only. It does not permit quadratic/TPS/local shape warping of the canonical SVG.',''
          ]
          Path('assets/scene05/georef_v0.3.2/README.md').write_text('\n'.join(lines),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/scene05/georef_v0.3.2
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Scene 05 georef model selection v0.3.2'
            git push
          fi
