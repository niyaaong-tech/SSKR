name: Scene 05 B Artwork One-Take v3.8.2

on:
  push:
    branches:
      - main
      - feature/scene05-v382-generated-finale
    paths:
      - '.github/workflows/scene05-b-v20.yml'
      - 'final/scene05-b/**'
      - 'assets/scene05/finale_generated_v382/**'
      - 'tools/scene05-b-source-v*.py'
      - 'tools/scene05-b-matte-assets-v381.py'
      - 'tools/scene05-b-v37-prep.py'
      - 'tools/scene05-b-v37-post.py'
      - 'tools/scene05-b-v38-post.py'
      - 'tools/scene05-b-v35-framing-fix.py'
      - 'tools/scene05-b-v36-evening-fix.py'
      - 'tools/scene05-b-peninsula-*.py'
      - 'tools/scene05-b-surface-relief-v34.py'
      - 'tools/scene05-b-conform-relief-v34.py'
      - 'tools/scene05-b-participant-routes-v32.py'
      - 'tools/scene05-b-road-overlay-v31.py'
      - 'tools/scene05-b-choice-data-v29.py'
      - 'tools/scene05-b-art-textures-v22.py'
      - 'tools/scene05-final-*.py'
      - 'assets/scene05/worldcover_v1/**'
      - 'assets/scene05/choice_roads_source_v1.geojson'
      - 'assets/scene05/route_network_v0.1/**'
      - 'assets/scene05/south_korea_hero_v0.2/**'
      - 'assets/vector/korean_peninsula_precise.svg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scene05-b-v382:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow pyproj trimesh cairosvg

      - name: Build peninsula and route resources
        run: |
          python tools/scene05-final-terrain-v1.py
          python tools/scene05-b-art-textures-v22.py
          python tools/scene05-final-data-v1.py
          python tools/scene05-b-peninsula-texture-v33.py
          python tools/scene05-b-surface-relief-v34.py
          python tools/scene05-b-peninsula-texture-v36.py
          python tools/scene05-b-peninsula-coastfix-v36.py
          python tools/scene05-b-peninsula-surface-v38.py
          python tools/scene05-b-peninsula-surface-v381.py
          python tools/scene05-b-road-overlay-v31.py
          python tools/scene05-b-choice-data-v29.py
          python tools/scene05-b-participant-routes-v32.py
          python tools/scene05-b-conform-relief-v34.py

      - name: Fetch dawn environment
        run: |
          mkdir -p output/scene05_final_v1
          curl -fL --retry 3 --retry-delay 2 -A 'SSKR-Scene05/1.0' \
            'https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Tonemapped%20JPG/umhlanga_sunrise.jpg' \
            -o output/scene05_final_v1/polyhaven_umhlanga_sunrise.jpg

      - name: Build SSKR generated-art finale
        run: |
          python tools/scene05-b-matte-assets-v381.py
          test -s output/scene05_final_v1/sky_dawn_v381.jpg
          test -s output/scene05_final_v1/sky_sunset_env_v381.jpg
          test -s output/scene05_final_v1/west_sunset_matte_v381.jpg
          test -s output/scene05_final_v1/cloud_veil_v381.png
          test -s output/scene05_final_v1/scene05_b_matte_assets_v381.json

      - name: Generate Scene 05 B v3.8.2 source
        run: |
          python tools/scene05-b-source-v20.py
          python tools/scene05-b-coast-source-v22.py
          python tools/scene05-b-source-v23.py
          python tools/scene05-b-source-v24.py
          python tools/scene05-b-source-v25.py
          python tools/scene05-b-source-v251.py
          python tools/scene05-b-source-v252.py
          python tools/scene05-b-source-v26.py
          python tools/scene05-b-source-v27.py
          python tools/scene05-b-source-v28.py
          python tools/scene05-b-source-v29.py
          python tools/scene05-b-source-v30.py
          python tools/scene05-b-source-v31.py
          python tools/scene05-b-source-v32.py
          python tools/scene05-b-source-v33.py
          python tools/scene05-b-source-v34.py
          python tools/scene05-b-source-v35.py
          python tools/scene05-b-v35-framing-fix.py
          python tools/scene05-b-source-v36.py
          python tools/scene05-b-v36-evening-fix.py
          python tools/scene05-b-v37-prep.py
          python tools/scene05-b-source-v37.py
          python tools/scene05-b-v37-post.py
          python tools/scene05-b-source-v38.py
          python tools/scene05-b-v38-post.py
          python tools/scene05-b-source-v381.py

      - name: Validate v3.8.2 source contracts
        run: |
          test -s output/scene05_final_v1/peninsula_surface_v381.png
          test -s output/scene05_final_v1/peninsula_mask_debug_v381.png
          test -s output/scene05_final_v1/peninsula_surface_v381_qa.json
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          q=json.loads(Path('output/scene05_final_v1/peninsula_surface_v381_qa.json').read_text())
          assert q['texture_size'][0] == 2688, q['texture_size']
          assert q['alpha_transition_pixel_count'] > 0, q
          assert q['runtime_sampling_policy_required']['alphaTest'] == 0.08
          m=json.loads(Path('output/scene05_final_v1/scene05_b_matte_assets_v381.json').read_text())
          assert m['schema_version'] == '3.8.2', m
          assert m['sunset_plate']['source_size'] == [1280,720], m['sunset_plate']
          assert m['sunset_plate']['output_size'] == [3840,2160], m['sunset_plate']
          assert m['sunset_plate']['visual_authority'] == 'SSKR generated project artwork', m['sunset_plate']
          assert Image.open('output/scene05_final_v1/west_sunset_matte_v381.jpg').size == (3840,2160)
          print(json.dumps({'coast': q['texture_size'], 'matte': m['sunset_plate']}, indent=2))
          PY
          test -s output/scene05-b-v381.js
          grep -q 'Scene 05 B v3.8.2' output/scene05-b-v381.js
          grep -q 'west_sunset_matte_v381.jpg' output/scene05-b-v381.js
          grep -q 'sceneMarkV382' output/scene05-b-v381.js
          grep -q 'sunSprite.visible = false' output/scene05-b-v381.js
          grep -q 'uReflectionStrength.value = 0.0' output/scene05-b-v381.js
          grep -q '__scene05V381State' output/scene05-b-v381.js
          grep -q '__scene05Diagnostic' output/scene05-b-v381.js

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install fonts
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk && fc-cache -f

      - name: Bundle v3.8.2
        run: |
          npm install --no-save --no-audit --no-fund three@0.185.1 gsap@3.15.0 esbuild puppeteer-core
          rm -rf final/scene05-b/dist && mkdir -p final/scene05-b/dist/assets
          npx esbuild output/scene05-b-v381.js --bundle --format=esm --target=es2022 --minify --outfile=final/scene05-b/dist/app.js
          cp final/scene05-b/index.html final/scene05-b/dist/index.html
          cp final/scene05-b/scene05-b.css final/scene05-b/dist/scene05-b.css
          cp final/scene05-b/README.md final/scene05-b/dist/README.md
          cp output/scene05_final_v1/{terrain_final_uv.glb,terrain_dawn_final.png,terrain_day_final.png,terrain_sunset_final.png,coast_shallow.png,peninsula_surface_v381.png,peninsula_mask_debug_v381.png,peninsula_surface_v381_qa.json,peninsula_surface_v34.json,road_choice_overlay_v31.png,scene05_final_data_v1.json,sky_dawn_v381.jpg,sky_sunset_env_v381.jpg,west_sunset_matte_v381.jpg,cloud_veil_v381.png,scene05_b_matte_assets_v381.json} final/scene05-b/dist/assets/
          cp assets/vector/korean_peninsula_precise.svg final/scene05-b/dist/assets/
          python final/scene05-b/pack_standalone.py
          test -s final/scene05-b/dist/SSKR_Scene05_B_30s_Journey_v3.8.1_standalone.html

      - name: Visual QA — generated finale and coastline diagnostics
        timeout-minutes: 6
        run: |
          python -m http.server 4174 --directory final/scene05-b/dist >/tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$BROWSER"
          timeout 320s xvfb-run -a env BROWSER_PATH="$BROWSER" node final/scene05-b/qa.mjs
          for f in \
            b381_015_peninsula b381_045_east_dawn b381_072_start_dawn b381_120_route_day b381_165_late_day \
            b381_189_finish_evening b381_210_finish_sunset b381_240_matte_transition b381_275_core_message b381_295_final_hold \
            b381_diag_surface_full b381_diag_surface_south b381_diag_surface_east b381_diag_surface_west \
            b381_diag_land_only b381_diag_land_ocean b381_diag_texture_only b381_diag_canonical_mask; do
            test -s "final/scene05-b/dist/${f}.png"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: SSKR-Scene05-B-Artwork-OneTake-v3.8.2
          path: final/scene05-b/dist/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30