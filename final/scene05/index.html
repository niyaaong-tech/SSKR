<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:," />
  <title>SSKR Scene 05 — Final Journey Map</title>
  <link rel="stylesheet" href="./scene05-final.css" />
  <script>
    // GitHub Actions uses software WebGL. In ?qa=1 mode, capture Three.js's
    // RAF callback instead of running it continuously; the QA harness renders
    // exactly once after each GSAP timeline seek. Normal playback is unchanged.
    if (new URLSearchParams(location.search).has('qa')) {
      window.__qaRafCallback = null;
      window.requestAnimationFrame = (callback) => {
        window.__qaRafCallback = callback;
        return 1;
      };
      window.cancelAnimationFrame = () => {};
    }
  </script>
</head>
<body>
  <main id="frame" aria-label="SSKR Scene 05 final presentation scene">
    <div id="atmosphere" aria-hidden="true">
      <div id="sky-night" class="sky-layer"></div>
      <div id="sky-dawn" class="sky-layer"></div>
      <div id="sky-day" class="sky-layer"></div>
      <div id="sky-sunset" class="sky-layer"></div>
      <div id="east-glow" class="horizon-glow"></div>
      <div id="west-glow" class="horizon-glow"></div>
    </div>

    <div id="three-stage"></div>

    <div id="overview-layer" aria-hidden="true">
      <img id="korea-overview" src="./assets/korean_peninsula_precise.svg" alt="" />
      <div id="overview-haze"></div>
    </div>

    <div id="light-wash" aria-hidden="true"></div>
    <div id="vignette" aria-hidden="true"></div>
    <div id="grain" aria-hidden="true"></div>
    <div id="match-orb" aria-hidden="true"></div>

    <header class="scene-mark">
      <span>SUNRISE SUNSET KOREAN RALLY</span>
      <strong>05 · JOURNEY MAP</strong>
    </header>

    <section id="statement" class="statement" aria-live="polite">
      <p>여러 해안에서 출발하고, 각자의 길을 지나,</p>
      <p>하나의 피니시에 모여, 개인 기록으로 남긴다.</p>
    </section>

    <div id="status" class="status">BUILDING THE DAY</div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
