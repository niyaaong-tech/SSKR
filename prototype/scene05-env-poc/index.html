<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SSKR Scene 05 ENV POC — Bundled</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020711;color:#eef4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:max(16px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));z-index:10;pointer-events:none;text-shadow:0 1px 9px #000}
#hud h1{font-size:13px;letter-spacing:.13em;margin:0 0 7px;font-weight:700}
#hud p{font-size:11px;opacity:.72;margin:2px 0;max-width:72vw;line-height:1.45}
#status{margin-top:9px;font-size:11px;color:#ffd48c}
#diag{font-size:10px;opacity:.58;margin-top:4px}
#controls{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;z-index:20}
button{appearance:none;border:1px solid rgba(255,255,255,.28);background:rgba(8,15,24,.68);color:#fff;border-radius:999px;padding:10px 14px;font-size:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
button.active{background:rgba(235,174,93,.25);border-color:rgba(255,212,140,.78)}
#error{position:fixed;left:12px;right:12px;bottom:64px;max-height:36vh;overflow:auto;white-space:pre-wrap;background:rgba(80,0,0,.88);padding:10px;border-radius:8px;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;z-index:99;display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud">
  <h1>SSKR · ENVIRONMENT POC · BUNDLED</h1>
  <p>SSKR DEM terrain · Takram atmosphere + volumetric clouds</p>
  <p>Route / Node / Fireworks / legacy sprite clouds excluded</p>
  <div id="status">BOOT</div>
  <div id="diag"></div>
</div>
<div id="controls">
  <button data-phase="dawn" class="active">Dawn</button>
  <button data-phase="day">Day</button>
  <button data-phase="sunset">Sunset</button>
</div>
<pre id="error"></pre>
<script>
window.addEventListener('error',e=>{
  const box=document.getElementById('error'); box.style.display='block';
  box.textContent=String(e.error?.stack||e.message||'Unknown resource error');
});
window.addEventListener('unhandledrejection',e=>{
  const box=document.getElementById('error'); box.style.display='block';
  box.textContent=String(e.reason?.stack||e.reason||'Unhandled rejection');
});
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
