name: Scene 05 Terrain Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scene05-terrain-build.yml'
      - 'tools/scene05-build-direct.py'
  workflow_dispatch:

jobs:
  build-terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install terrain dependencies
        run: python -m pip install boto3 numpy Pillow rasterio pyproj scipy trimesh

      - name: Apply provisional ocean mask rule
        run: sed -i 's/(dem>-100)/(dem>0.5)/' tools/scene05-build-direct.py

      - name: Build actual South Korea Hero terrain v0.1
        run: python tools/scene05-build-direct.py

      - name: Upload generated terrain asset
        uses: actions/upload-artifact@v4
        with:
          name: SSKR-Scene05-SouthKoreaHero-Terrain-v0.1
          path: output/south_korea_hero_v0.1/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
