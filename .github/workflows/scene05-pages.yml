name: Deploy Scene 05 B v3.4 to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/scene05-env-poc-bundled
    paths:
      - '.github/workflows/scene05-pages.yml'
      - 'prototype/scene05-env-poc/**'
      - 'final/scene05-b/index.html'
      - 'final/scene05-b/scene05-b.css'
      - 'final/scene05-b/pack_standalone.py'
      - 'final/scene05-b/README.md'
      - 'final/scene05-b/src/**'
      - 'tools/scene05-b-source-v*.py'
      - 'tools/scene05-b-surface-relief-v34.py'
      - 'tools/scene05-b-conform-relief-v34.py'
      - 'tools/scene05-b-peninsula-texture-v33.py'
      - 'tools/scene05-b-participant-routes-v32.py'
      - 'tools/scene05-b-road-overlay-v31.py'
      - 'tools/scene05-b-choice-data-v29.py'
      - 'tools/scene05-b-art-textures-v22.py'
      - 'tools/scene05-final-*.py'
      - 'assets/scene05/worldcover_v1/**'
      - 'assets/scene05/choice_roads_source_v1.geojson'
      - 'assets/scene05/route_network_v0.1/**'
      - 'assets/scene05/south_korea_hero_v0.2/**'
      - 'assets/vector/korean_peninsula_precise.svg'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scene05-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Scene 05 B v3.4 assets
        if: github.ref == 'refs/heads/main'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow pyproj trimesh cairosvg
          python tools/scene05-final-terrain-v1.py
          python tools/scene05-b-art-textures-v22.py
          python tools/scene05-final-data-v1.py
          python tools/scene05-b-peninsula-texture-v33.py
          python tools/scene05-b-surface-relief-v34.py
          python tools/scene05-b-road-overlay-v31.py
          python tools/scene05-b-choice-data-v29.py
          python tools/scene05-b-participant-routes-v32.py
          python tools/scene05-b-conform-relief-v34.py
          python tools/scene05-b-source-v20.py
          python tools/scene05-b-coast-source-v22.py
          python tools/scene05-b-source-v23.py
          python tools/scene05-b-source-v24.py
          python tools/scene05-b-source-v25.py
          python tools/scene05-b-source-v251.py
          python tools/scene05-b-source-v252.py
          python tools/scene05-b-source-v26.py
          python tools/scene05-b-source-v27.py
          python tools/scene05-b-source-v28.py
          python tools/scene05-b-source-v29.py
          python tools/scene05-b-source-v30.py
          python tools/scene05-b-source-v31.py
          python tools/scene05-b-source-v32.py
          python tools/scene05-b-source-v33.py
          python tools/scene05-b-source-v34.py
          test -s output/scene05_final_v1/terrain_final_uv.glb
          test -s output/scene05_final_v1/peninsula_surface_v33.png
          test -s output/scene05_final_v1/peninsula_surface_v34.json
          test -s output/scene05_final_v1/road_choice_overlay_v31.png
          test -s output/scene05_final_v1/scene05_final_data_v1.json
          test -s output/scene05-b-v34.js
          grep -q '2.2-v34-surface-conformed' output/scene05_final_v1/scene05_final_data_v1.json

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build deployable Scene 05 B v3.4
        if: github.ref == 'refs/heads/main'
        run: |
          npm install --no-save --no-audit --no-fund three@0.185.1 gsap@3.15.0 esbuild
          rm -rf final/scene05-b/dist
          mkdir -p final/scene05-b/dist/assets
          npx esbuild output/scene05-b-v34.js --bundle --format=esm --target=es2022 --minify --outfile=final/scene05-b/dist/app.js
          cp final/scene05-b/index.html final/scene05-b/dist/index.html
          cp final/scene05-b/scene05-b.css final/scene05-b/dist/scene05-b.css
          cp final/scene05-b/README.md final/scene05-b/dist/README.md
          cp output/scene05_final_v1/terrain_final_uv.glb final/scene05-b/dist/assets/
          cp output/scene05_final_v1/terrain_dawn_final.png final/scene05-b/dist/assets/
          cp output/scene05_final_v1/terrain_day_final.png final/scene05-b/dist/assets/
          cp output/scene05_final_v1/terrain_sunset_final.png final/scene05-b/dist/assets/
          cp output/scene05_final_v1/coast_shallow.png final/scene05-b/dist/assets/
          cp output/scene05_final_v1/peninsula_surface_v33.png final/scene05-b/dist/assets/
          cp output/scene05_final_v1/peninsula_surface_v34.json final/scene05-b/dist/assets/
          cp output/scene05_final_v1/road_choice_overlay_v31.png final/scene05-b/dist/assets/
          cp output/scene05_final_v1/scene05_final_data_v1.json final/scene05-b/dist/assets/
          cp assets/vector/korean_peninsula_precise.svg final/scene05-b/dist/assets/
          python final/scene05-b/pack_standalone.py
          test -s final/scene05-b/dist/index.html
          test -s final/scene05-b/dist/app.js
          test -s final/scene05-b/dist/assets/peninsula_surface_v33.png
          test -s final/scene05-b/dist/assets/peninsula_surface_v34.json
          test -s final/scene05-b/dist/SSKR_Scene05_B_ArtworkPass_OneTake_v3.4_standalone.html

      - name: Build bundled ENV POC
        working-directory: prototype/scene05-env-poc
        run: |
          npm install --no-audit --no-fund --package-lock=false
          rm -rf dist
          mkdir -p dist/assets/clouds dist/assets/core
          npm run build
          cp index.html dist/index.html
          cp ../../assets/scene05/south_korea_hero_v0.2/terrain_lod.glb dist/assets/
          cp ../../assets/scene05/south_korea_hero_v0.2/albedo.png dist/assets/
          cp node_modules/@takram/three-clouds/assets/local_weather.png dist/assets/clouds/
          cp node_modules/@takram/three-clouds/assets/shape.bin dist/assets/clouds/
          cp node_modules/@takram/three-clouds/assets/shape_detail.bin dist/assets/clouds/
          cp node_modules/@takram/three-clouds/assets/turbulence.png dist/assets/clouds/
          cp node_modules/@takram/three-geospatial/assets/stbn.bin dist/assets/core/
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/assets/terrain_lod.glb
          test -s dist/assets/clouds/shape.bin
          test -s dist/assets/core/stbn.bin

      - name: Add ENV POC to Pages artifact
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf final/scene05-b/dist/env-poc
          mkdir -p final/scene05-b/dist/env-poc
          cp -R prototype/scene05-env-poc/dist/. final/scene05-b/dist/env-poc/
          test -s final/scene05-b/dist/env-poc/index.html
          test -s final/scene05-b/dist/env-poc/app.js

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: final/scene05-b/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Scene 05 B v3.4 + ENV POC to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
