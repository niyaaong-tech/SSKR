name: Scene 05 Prototype v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scene05-prototype-v01.yml'
      - 'prototype/scene05/**'
      - 'tools/scene05-route3d-integrate-v01.py'
      - 'assets/scene05/route_network_v0.1/scene05_route_network_v01.geojson'
      - 'assets/scene05/route_network_v0.1/scene05_route_network_v01.json'
      - 'assets/scene05/south_korea_hero_v0.2/**'
      - 'assets/vector/korean_peninsula_precise.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-scene05-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build terrain-following 3D route data
        run: |
          python -m pip install numpy Pillow pyproj
          python tools/scene05-route3d-integrate-v01.py
          mkdir -p prototype/scene05/generated
          cp output/scene05_route3d_v0.1/scene05_route_network_3d_v01.json prototype/scene05/generated/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bundle Three.js prototype
        run: |
          npm install --no-save --no-audit --no-fund three@0.185.1 gsap@3.15.0 esbuild
          rm -rf prototype/scene05/dist
          mkdir -p prototype/scene05/dist/assets
          npx esbuild prototype/scene05/src/scene05.js --bundle --format=esm --target=es2022 --minify --outfile=prototype/scene05/dist/app.js
          cp prototype/scene05/index.html prototype/scene05/dist/index.html
          cp prototype/scene05/scene05.css prototype/scene05/dist/scene05.css
          cp prototype/scene05/README.md prototype/scene05/dist/README.md
          cp assets/scene05/south_korea_hero_v0.2/terrain_lod.glb prototype/scene05/dist/assets/terrain_lod.glb
          cp assets/vector/korean_peninsula_precise.svg prototype/scene05/dist/assets/korean_peninsula_precise.svg
          cp prototype/scene05/generated/scene05_route_network_3d_v01.json prototype/scene05/dist/assets/scene05_route_network_3d_v01.json

      - name: Headless visual smoke test and keyframes
        run: |
          python -m http.server 4173 --directory prototype/scene05/dist > /tmp/scene05-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$BROWSER" ]; then
            echo 'No Chromium-compatible browser on runner' >&2
            exit 1
          fi
          for SPEC in '2800 keyframe_03s' '6500 keyframe_07s' '9500 keyframe_10s'; do
            set -- $SPEC
            BUDGET=$1
            NAME=$2
            timeout 55s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --use-angle=swiftshader --enable-webgl --ignore-gpu-blocklist --hide-scrollbars --window-size=1920,1080 --virtual-time-budget=$BUDGET --screenshot="prototype/scene05/dist/${NAME}.png" http://127.0.0.1:4173/
            test -s "prototype/scene05/dist/${NAME}.png"
          done

      - name: Upload portable prototype
        uses: actions/upload-artifact@v4
        with:
          name: SSKR-Scene05-ThreeJS-Prototype-v0.1
          path: prototype/scene05/dist/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Publish route 3D data and QA keyframes
        run: |
          mkdir -p assets/scene05/route_network_v0.1 prototype/scene05/preview
          cp prototype/scene05/generated/scene05_route_network_3d_v01.json assets/scene05/route_network_v0.1/
          cp prototype/scene05/dist/keyframe_03s.png prototype/scene05/preview/
          cp prototype/scene05/dist/keyframe_07s.png prototype/scene05/preview/
          cp prototype/scene05/dist/keyframe_10s.png prototype/scene05/preview/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/scene05/route_network_v0.1/scene05_route_network_3d_v01.json prototype/scene05/preview
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Scene 05 Three.js prototype QA assets v0.1'
            git push
          fi
