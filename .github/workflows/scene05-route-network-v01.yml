name: Scene 05 Route Network v0.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scene05-route-network-v01.yml'
      - 'tools/scene05-route-network-v01.py'
      - 'assets/scene05/south_korea_hero_v0.2/svg_georef.json'
      - 'assets/vector/korean_peninsula_precise.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-route-network-v01:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install route dependencies
        run: python -m pip install numpy Pillow scipy pyproj requests cairosvg networkx

      - name: Build real-road Scene 05 route network
        run: python tools/scene05-route-network-v01.py

      - name: Upload route artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSKR-Scene05-RouteNetwork-v0.1
          path: output/scene05_route_network_v0.1/
          if-no-files-found: error
          retention-days: 30

      - name: Publish route assets
        run: |
          mkdir -p assets/scene05/route_network_v0.1
          cp output/scene05_route_network_v0.1/scene05_route_network_v01.json assets/scene05/route_network_v0.1/
          cp output/scene05_route_network_v0.1/scene05_route_network_v01.geojson assets/scene05/route_network_v0.1/
          cp output/scene05_route_network_v0.1/scene05_route_network_preview_v01.png assets/scene05/route_network_v0.1/
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('assets/scene05/route_network_v0.1/scene05_route_network_v01.json').read_text('utf-8'))
          distances=', '.join(f"{r['start_id']} {r['distance_km']:.0f}km" for r in d['routes'])
          lines=[
              '# Scene 05 Route Network v0.1','',
              'Presentation-only route network generated from real OpenStreetMap major-road topology.','',
              f"- Road graph: {d['road_graph']['nodes']:,} nodes / {d['road_graph']['edges']:,} edges",
              f"- Representative routes: {len(d['routes'])}",
              f"- Shared road segments: {d['shared_segment_count']:,}",
              f"- Route lengths: {distances}",'',
              'Start nodes are visual coastal references, not confirmed event Start spots. The west finish is also a visual placeholder, not a confirmed event finish. SSKR still uses external navigation; this is a cinematic presentation asset, not a navigation engine.',''
          ]
          Path('assets/scene05/route_network_v0.1/README.md').write_text('\n'.join(lines),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/scene05/route_network_v0.1
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Scene 05 real-road route network v0.1'
            git push
          fi
