<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:," />
  <title>SSKR Scene 05 B — Three-Reference Sunset Finale v3.8.3</title>
  <link rel="stylesheet" href="./scene05-b.css" />
  <script>
    if (new URLSearchParams(location.search).has('qa')) {
      window.__qaRafCallback = null;
      window.requestAnimationFrame = (callback) => {
        window.__qaRafCallback = callback;
        return 1;
      };
      window.cancelAnimationFrame = () => {};
    }
  </script>
</head>
<body>
  <main id="frame" aria-label="SSKR Scene 05 B 30-second journey presentation scene">
    <div id="atmosphere" aria-hidden="true">
      <div id="sky-night" class="sky-layer"></div>
      <div id="sky-dawn" class="sky-layer"></div>
      <div id="sky-day" class="sky-layer"></div>
      <div id="sky-sunset" class="sky-layer"></div>
      <div id="sky-bluehour" class="sky-layer"></div>
      <div id="east-glow" class="horizon-glow"></div>
      <div id="west-glow" class="horizon-glow"></div>
    </div>

    <div id="three-stage"></div>

    <!--
      v3.8.3 finale remains outside Three.js / EffectComposer. The 0-22s live map
      is unchanged; the visible 22-30s plate is the selected user-provided West Sea
      sunset reference, kept as one coherent sky/sun/sea/reflection/coast image.
    -->
    <div id="finale-matte-v383" aria-hidden="true">
      <img src="./assets/west_sunset_matte_v383.jpg" alt="" />
    </div>

    <div id="overview-layer" aria-hidden="true">
      <img id="korea-overview" src="./assets/korean_peninsula_precise.svg" alt="" />
      <div id="overview-haze"></div>
    </div>

    <div id="dawn-grade" aria-hidden="true"></div>
    <div id="light-wash" aria-hidden="true"></div>
    <div id="vignette" aria-hidden="true"></div>
    <div id="grain" aria-hidden="true"></div>

    <header class="scene-mark">
      <span>SUNRISE SUNSET KOREAN RALLY</span>
      <strong>05B · 30S JOURNEY</strong>
    </header>

    <section id="statement" class="statement" aria-live="polite">
      <p>각자의 길이 하나의 완주로 모이고,</p>
      <p>함께한 하루는 오래 남는 라이더의 기억이 됩니다.</p>
    </section>

    <div class="data-credit" aria-label="data and artwork credit">© ESA WorldCover project 2021 / Copernicus Sentinel · Dawn environment: Poly Haven CC0 · Finale artwork: SSKR project reference</div>
    <div id="status" class="status">BUILDING V3.8.3 SUNSET FINALE</div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
