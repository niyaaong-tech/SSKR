name: Scene 05 ESA WorldCover Source v1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/scene05-worldcover-v1.yml','tools/scene05-worldcover-source-v1.py']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build-worldcover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download and reproject ESA WorldCover Korea subset
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow rasterio boto3
          python tools/scene05-worldcover-source-v1.py
          test -s output/scene05_worldcover_v1/worldcover_local_v1.png
          test -s output/scene05_worldcover_v1/worldcover_local_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: SSKR-Scene05-WorldCover-v1
          path: output/scene05_worldcover_v1/
          retention-days: 30
      - name: Publish compact WorldCover source
        run: |
          mkdir -p assets/scene05/worldcover_v1
          cp output/scene05_worldcover_v1/worldcover_local_v1.png assets/scene05/worldcover_v1/
          cp output/scene05_worldcover_v1/worldcover_local_v1.json assets/scene05/worldcover_v1/
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/scene05/worldcover_v1
          if ! git diff --cached --quiet; then git commit -m 'Publish Scene 05 ESA WorldCover source v1'; git push; fi
