name: Scene 05 Terrain v0.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scene05-terrain-v02.yml'
      - 'tools/scene05-georef-build-v02.py'
      - 'assets/vector/source_chunks/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-terrain-v02:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geospatial dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow scipy rasterio pyproj shapely geopandas pyogrio trimesh boto3 requests cairosvg opencv-python-headless gdown

      - name: Restore canonical Korea SVG from repository chunks
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          root = Path('assets/vector')
          parts = sorted((root/'source_chunks').glob('korean_peninsula_precise.svg.gz.b64.part*'))
          if len(parts) != 6:
              raise SystemExit(f'Expected 6 SVG source chunks, got {len(parts)}')
          text = ''.join(p.read_text('ascii').strip() for p in parts)
          raw = gzip.decompress(base64.b64decode(text))
          out = root/'korean_peninsula_precise.svg'
          out.write_bytes(raw)
          print('canonical SVG bytes:', len(raw))
          print('canonical SVG sha256:', hashlib.sha256(raw).hexdigest())
          if len(raw) < 60000 or not raw.lstrip().startswith(b'<svg'):
              raise SystemExit('Reconstructed canonical SVG failed sanity check')
          PY

      - name: Build georeferenced South Korea Hero terrain v0.2
        run: python tools/scene05-georef-build-v02.py

      - name: Upload full v0.2 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSKR-Scene05-SouthKoreaHero-Terrain-v0.2
          path: output/south_korea_hero_v0.2/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Publish web-ready v0.2 assets to repository
        run: |
          mkdir -p assets/scene05/south_korea_hero_v0.2
          cp output/south_korea_hero_v0.2/albedo.png assets/scene05/south_korea_hero_v0.2/
          cp output/south_korea_hero_v0.2/height_u16.png assets/scene05/south_korea_hero_v0.2/
          cp output/south_korea_hero_v0.2/hillshade.png assets/scene05/south_korea_hero_v0.2/
          cp output/south_korea_hero_v0.2/land_mask_precise_svg.png assets/scene05/south_korea_hero_v0.2/
          cp output/south_korea_hero_v0.2/normal.png assets/scene05/south_korea_hero_v0.2/
          cp output/south_korea_hero_v0.2/slope.png assets/scene05/south_korea_hero_v0.2/
          cp output/south_korea_hero_v0.2/terrain_lod.glb assets/scene05/south_korea_hero_v0.2/
          cp output/south_korea_hero_v0.2/terrain_metadata.json assets/scene05/south_korea_hero_v0.2/
          cp output/south_korea_hero_v0.2/svg_georef.json assets/scene05/south_korea_hero_v0.2/
          cp output/south_korea_hero_v0.2/georef_reference_overlay.png assets/scene05/south_korea_hero_v0.2/
          cp output/south_korea_hero_v0.2/terrain_qa_preview_v02.png assets/scene05/south_korea_hero_v0.2/
          cp output/south_korea_hero_v0.2/source_tiles.json assets/scene05/south_korea_hero_v0.2/
          cp output/south_korea_hero_v0.2/BUILD_PROVENANCE.json assets/scene05/south_korea_hero_v0.2/
          cat > assets/scene05/south_korea_hero_v0.2/README.md <<'EOF'
          # South Korea Hero Terrain v0.2

          Scene 05 production terrain candidate.

          - Elevation: Copernicus DEM GLO-30
          - Coastline: SSKR canonical `korean_peninsula_precise.svg`
          - Georeference calibration/QA: Natural Earth 10m Korea union only
          - Vertical exaggeration: 1.5x
          - Precise SVG coastline clip: applied

          Natural Earth is not used as the final coastline geometry. It is only a geographic placement reference for the canonical SVG.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vector/korean_peninsula_precise.svg assets/scene05/south_korea_hero_v0.2
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Scene 05 South Korea Hero terrain v0.2'
            git push
          fi
