name: Deploy Scene 05 Final v1.8 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scene05-pages.yml'
      - 'final/scene05/index.html'
      - 'final/scene05/scene05-final.css'
      - 'final/scene05/pack_standalone.py'
      - 'final/scene05/README.md'
      - 'tools/scene05-final-data-v1.py'
      - 'tools/scene05-final-terrain-v1.py'
      - 'tools/scene05-final-roadtexture-v1.py'
      - 'tools/scene05-final-v17-source.py'
      - 'assets/scene05/road_hints_source_v1.geojson'
      - 'assets/scene05/route_network_v0.1/**'
      - 'assets/scene05/south_korea_hero_v0.2/**'
      - 'assets/vector/korean_peninsula_precise.svg'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scene05-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build terrain, daylight road context, route data, and renderer source
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow pyproj trimesh
          python tools/scene05-final-terrain-v1.py
          python tools/scene05-final-roadtexture-v1.py
          python tools/scene05-final-data-v1.py
          python tools/scene05-final-v17-source.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build deployable Scene 05
        run: |
          npm install --no-save --no-audit --no-fund three@0.185.1 gsap@3.15.0 esbuild
          rm -rf final/scene05/dist
          mkdir -p final/scene05/dist/assets
          npx esbuild output/scene05_final_v1/scene05-final-v17.js --bundle --format=esm --target=es2022 --minify --outfile=final/scene05/dist/app.js
          cp final/scene05/index.html final/scene05/dist/index.html
          cp final/scene05/scene05-final.css final/scene05/dist/scene05-final.css
          cp final/scene05/README.md final/scene05/dist/README.md
          cp output/scene05_final_v1/terrain_final_uv.glb final/scene05/dist/assets/
          cp output/scene05_final_v1/terrain_dawn_final.png final/scene05/dist/assets/
          cp output/scene05_final_v1/terrain_day_final.png final/scene05/dist/assets/
          cp output/scene05_final_v1/terrain_sunset_final.png final/scene05/dist/assets/
          cp output/scene05_final_v1/scene05_final_data_v1.json final/scene05/dist/assets/
          cp assets/vector/korean_peninsula_precise.svg final/scene05/dist/assets/
          python final/scene05/pack_standalone.py
          test -s final/scene05/dist/index.html
          test -s final/scene05/dist/app.js
          test -s final/scene05/dist/assets/terrain_final_uv.glb

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: final/scene05/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
