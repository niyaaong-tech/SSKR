<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f10" />
  <meta name="description" content="SSKR 2027 참가 안내와 참가자 전용 서비스를 확인하세요." />
  <base href="/participate/" />
  <title>SSKR 2027 참가</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css?v=patch-031" />
</head>
<body>
  <a class="skip-link" href="#context-surface">참가 화면으로 바로가기</a>

  <main class="participate-page">
    <section class="event-panel" aria-labelledby="event-title">
      <div class="event-photo" aria-hidden="true"></div>
      <div class="event-shade" aria-hidden="true"></div>

      <header class="event-header">
        <a class="brand" href="/" aria-label="SSKR 홈으로 이동">
          <strong>SSKR</strong>
          <span>SUNRISE SUNSET<br />KOREAN RALLY</span>
        </a>
        <span class="season" id="event-season"></span>
      </header>

      <div class="event-copy">
        <div class="event-kicker">
          <span class="event-status" id="event-status"></span>
          <span id="event-category"></span>
        </div>

        <h1 id="event-title"><span id="event-title-line"></span><strong id="event-subtitle"></strong></h1>
        <p class="event-description" id="event-description"></p>

        <dl class="event-facts" id="event-facts"></dl>

        <div class="event-actions">
          <button class="primary-action" id="primary-action" type="button"><span>신청 계속하기</span><b aria-hidden="true">→</b></button>
        </div>
      </div>

      <p class="event-note">상세 일정과 제공 품목은 운영 상황에 따라 변경될 수 있습니다.</p>
    </section>

    <section class="service-panel" id="context-surface" aria-live="polite">
      <div class="account-shell" id="account-shell" hidden></div>
      <section class="surface-view surface-view--loading is-active" id="mode-loading" data-surface-mode="MODE_LOADING" aria-label="참가 정보 불러오는 중">
        <div class="loading-column"><i aria-hidden="true"></i><p>참가 정보를 불러오고 있습니다.</p></div>
      </section>

      <div class="surface-view surface-view--review" id="mode-a" data-surface-mode="MODE_A" hidden>
        <div class="benefit-area">
          <header class="benefit-heading">
            <h2 id="benefit-title">참가 혜택 &amp; 전용 서비스 <i aria-hidden="true"></i></h2>
            <p>참가하면 누릴 수 있는 특별한 경험 <span aria-hidden="true">✧</span></p>
          </header>

          <div class="benefit-grid" id="benefit-grid"></div>
        </div>

        <section class="manager-area" id="manager" aria-labelledby="manager-title">
          <header class="manager-heading">
            <div>
              <h2 id="manager-title"></h2>
              <p id="manager-description"></p>
            </div>
            <span>참가 확정 후 이용 가능</span>
          </header>

          <ol class="manager-flow" id="manager-flow"></ol>
          <ul class="manager-promises" id="manager-promises"></ul>
        </section>
      </div>

      <section class="surface-view surface-view--auth" id="mode-auth" data-surface-mode="MODE_AUTH" aria-labelledby="auth-title" hidden>
        <div class="auth-column">
          <div class="auth-brand" aria-label="SSKR">SSKR</div>
          <h2 id="auth-title" tabindex="-1">소셜 계정으로 참여하기</h2>

          <div class="social-actions" id="social-actions">
            <button class="social-button social-button--google" type="button" data-provider="google">
              <svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
              </svg>
              <span>Google로 이용하기</span>
            </button>
            <button class="social-button social-button--naver" type="button" data-provider="naver">
              <img src="./assets/naver-n.png" alt="" aria-hidden="true" />
              <span>네이버로 이용하기</span>
            </button>
            <button class="social-button social-button--kakao" type="button" data-provider="kakao">
              <img src="./assets/kakao-symbol.png" alt="" aria-hidden="true" />
              <span>카카오로 이용하기</span>
            </button>
            <button class="social-button social-button--apple" type="button" data-provider="apple">
              <svg width="15" height="17" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#fff" d="M17.05 12.53c-.02-2.06 1.68-3.05 1.76-3.1-.96-1.4-2.46-1.6-2.99-1.62-1.27-.13-2.48.75-3.13.75-.64 0-1.64-.73-2.7-.71-1.39.02-2.67.81-3.38 2.05-1.44 2.5-.37 6.2 1.03 8.23.68.99 1.5 2.11 2.57 2.07 1.03-.04 1.42-.67 2.67-.67 1.24 0 1.6.67 2.69.65 1.11-.02 1.81-1.01 2.49-2.01.78-1.15 1.11-2.27 1.13-2.33-.02-.01-2.17-.83-2.19-3.29zM15.02 6.5c.57-.69.95-1.65.85-2.6-.82.03-1.81.54-2.4 1.23-.53.61-.99 1.59-.87 2.52.91.07 1.85-.46 2.42-1.15z" />
              </svg>
              <span>Apple로 이용하기</span>
            </button>
          </div>

          <p class="auth-payment-note">참가비용은 소셜 연동 확인 후 별도 절차로 결제됩니다.</p>
        </div>
      </section>

      <section class="surface-view surface-view--application" id="mode-b" data-surface-mode="MODE_B" hidden></section>
      <section class="surface-view surface-view--lobby" id="mode-c" data-surface-mode="MODE_C" hidden></section>
      <section class="surface-view surface-view--account" id="mode-account" data-surface-mode="MODE_ACCOUNT" hidden></section>
      <section class="surface-view surface-view--error" id="mode-error" data-surface-mode="MODE_ERROR" aria-labelledby="surface-error-title" hidden>
        <div class="error-column"><span aria-hidden="true">!</span><h2 id="surface-error-title" tabindex="-1">참가 정보를 불러오지 못했습니다.</h2><p id="surface-error-message">현재 상태를 다시 확인해 주세요.</p><button type="button" id="surface-retry">다시 시도</button></div>
      </section>
    </section>
  </main>

  <script src="./data.js?v=patch-031"></script>
  <script src="./mock-auth.js?v=patch-031"></script>
  <script src="./mock-session.js?v=patch-031"></script>
  <script src="./api-client.js?v=patch-031"></script>
  <script src="./step1-content.js?v=patch-031"></script>
  <script src="./mode-b.js?v=patch-031"></script>
  <script src="./mode-c.js?v=patch-031"></script>
  <script src="./account.js?v=patch-031"></script>
  <script src="./app.js?v=patch-031"></script>
</body>
</html>
