name: Scene 05 C 2D Ocean Texture QA v0.1

on:
  push:
    branches:
      - feature/scene05-c-ocean-texture-v01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scene05-c-v01:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow pyproj trimesh cairosvg

      - name: Build accepted peninsula and route resources
        run: |
          python tools/scene05-final-terrain-v1.py
          python tools/scene05-b-art-textures-v22.py
          python tools/scene05-final-data-v1.py
          python tools/scene05-b-peninsula-texture-v33.py
          python tools/scene05-b-surface-relief-v34.py
          python tools/scene05-b-peninsula-texture-v36.py
          python tools/scene05-b-peninsula-coastfix-v36.py
          python tools/scene05-b-peninsula-surface-v38.py
          python tools/scene05-b-peninsula-surface-v381.py
          python tools/scene05-b-road-overlay-v31.py
          python tools/scene05-b-choice-data-v29.py
          python tools/scene05-b-participant-routes-v32.py
          python tools/scene05-b-conform-relief-v34.py

      - name: Fetch inherited dawn environment and finale support
        run: |
          mkdir -p output/scene05_final_v1
          curl -fL --retry 3 --retry-delay 2 -A 'SSKR-Scene05/1.0' \
            'https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Tonemapped%20JPG/umhlanga_sunrise.jpg' \
            -o output/scene05_final_v1/polyhaven_umhlanga_sunrise.jpg
          python tools/scene05-b-matte-assets-v383.py
          test -s output/scene05_final_v1/sky_dawn_v381.jpg
          test -s output/scene05_final_v1/sky_sunset_env_v381.jpg
          test -s output/scene05_final_v1/cloud_veil_v381.png

      - name: Validate inherited finale stills
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('assets/scene05/finale_v384_stills')
          names=['finale_still_01_v384.avif','finale_still_02_v384.avif','finale_still_03_v384.avif']
          for name in names:
              p=root/name
              assert p.stat().st_size > 9000, (name,p.stat().st_size)
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  assert im.width == 1024 and im.height == 576, (name,im.size)
          PY

      - name: Generate accepted B v3.8.4 runtime then apply C ocean pass
        run: |
          python tools/scene05-b-source-v20.py
          python tools/scene05-b-coast-source-v22.py
          python tools/scene05-b-source-v23.py
          python tools/scene05-b-source-v24.py
          python tools/scene05-b-source-v25.py
          python tools/scene05-b-source-v251.py
          python tools/scene05-b-source-v252.py
          python tools/scene05-b-source-v26.py
          python tools/scene05-b-source-v27.py
          python tools/scene05-b-source-v28.py
          python tools/scene05-b-source-v29.py
          python tools/scene05-b-source-v30.py
          python tools/scene05-b-source-v31.py
          python tools/scene05-b-source-v32.py
          python tools/scene05-b-source-v33.py
          python tools/scene05-b-source-v34.py
          python tools/scene05-b-source-v35.py
          python tools/scene05-b-v35-framing-fix.py
          python tools/scene05-b-source-v36.py
          python tools/scene05-b-v36-evening-fix.py
          python tools/scene05-b-v37-prep.py
          python tools/scene05-b-source-v37.py
          python tools/scene05-b-v37-post.py
          python tools/scene05-b-source-v38.py
          python tools/scene05-b-v38-post.py
          python tools/scene05-b-source-v381.py
          python tools/scene05-b-source-v383.py
          python tools/scene05-b-source-v384.py
          python tools/scene05-c-source-v01.py
          test -s output/scene05-c-v01.js
          grep -q 'Scene 05 C v0.1' output/scene05-c-v01.js
          grep -q '__scene05COceanState' output/scene05-c-v01.js
          grep -q 'p.z+=vWave\*0.015' output/scene05-c-v01.js
          grep -q 'shallow\*0.36\*coastDay' output/scene05-c-v01.js

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install fonts and JS dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          npm install --no-save --no-audit --no-fund three@0.185.1 gsap@3.15.0 esbuild puppeteer-core

      - name: Bundle Scene 05 C
        run: |
          rm -rf final/scene05-c/dist
          mkdir -p final/scene05-c/dist/assets
          npx esbuild output/scene05-c-v01.js --bundle --format=esm --target=es2022 --minify --outfile=final/scene05-c/dist/app.js
          cp final/scene05-c/index.html final/scene05-c/dist/index.html
          cp final/scene05-c/scene05-c.css final/scene05-c/dist/scene05-c.css
          cp final/scene05-c/README.md final/scene05-c/dist/README.md
          cp output/scene05_final_v1/{terrain_final_uv.glb,terrain_dawn_final.png,terrain_day_final.png,terrain_sunset_final.png,coast_shallow.png,peninsula_surface_v381.png,peninsula_mask_debug_v381.png,peninsula_surface_v381_qa.json,peninsula_surface_v34.json,road_choice_overlay_v31.png,scene05_final_data_v1.json,sky_dawn_v381.jpg,sky_sunset_env_v381.jpg,cloud_veil_v381.png} final/scene05-c/dist/assets/
          cp assets/scene05/finale_v384_stills/finale_still_*_v384.avif final/scene05-c/dist/assets/
          cp assets/vector/korean_peninsula_precise.svg final/scene05-c/dist/assets/
          test -s final/scene05-c/dist/app.js
          test -s final/scene05-c/dist/assets/korean_peninsula_precise.svg

      - name: Visual smoke QA
        timeout-minutes: 6
        run: |
          python -m http.server 4175 --directory final/scene05-c/dist >/tmp/http-c.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$BROWSER"
          timeout 320s xvfb-run -a env BROWSER_PATH="$BROWSER" node final/scene05-c/qa.mjs
          for f in \
            c01_015_peninsula_ocean c01_045_east_dawn_ocean c01_120_route_day_ocean \
            c01_165_late_day_ocean c01_189_finish_evening_ocean c01_210_finish_sunset_ocean \
            c01_244_finale_regression c01_295_final_hold_regression \
            c01_diag_surface_full c01_diag_land_ocean c01_diag_canonical_mask; do
            test -s "final/scene05-c/dist/${f}.png"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: SSKR-Scene05-C-2D-Ocean-v0.1
          path: final/scene05-c/dist/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
