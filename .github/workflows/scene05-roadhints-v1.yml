name: Scene 05 Road Hints Source v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scene05-roadhints-v1.yml'
      - 'tools/scene05-final-roadhints-source-v1.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-road-hints-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Query and simplify real major-road hints
        run: |
          python -m pip install requests
          python tools/scene05-final-roadhints-source-v1.py
          test -s output/scene05_roadhints_source_v1/scene05_road_hints_source_v1.geojson

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSKR-Scene05-RoadHints-Source-v1
          path: output/scene05_roadhints_source_v1/
          if-no-files-found: error
          retention-days: 30

      - name: Publish source data
        run: |
          mkdir -p assets/scene05
          cp output/scene05_roadhints_source_v1/scene05_road_hints_source_v1.geojson assets/scene05/road_hints_source_v1.geojson
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/scene05/road_hints_source_v1.geojson
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Scene 05 real major-road hint source v1'
            git push
          fi
