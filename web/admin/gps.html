<!doctype html>
<html lang="ko"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#788a7f">
  <title>GPS 현장 테스트 · SSKR</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="/web/admin/event-admin.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/web/shared/map/map.css"><link rel="stylesheet" href="/web/admin/gps.css">
</head><body class="gps-page">
<header class="admin-header"><a class="admin-brand" href="/app"><img src="/web/shared/brand/wordmark.svg" alt="SSKR" width="628" height="141"></a><strong>GPS 현장 테스트</strong><a id="settings-link" href="/app/admin/gps" hidden>테스트 설정</a><a href="/app">매니저</a></header>
<main class="admin-main">
  <div id="status" class="notice" role="status" aria-live="polite">테스트를 불러오고 있습니다.</div>
  <button id="login" class="button button-primary" hidden>Google로 로그인</button><button id="reload" class="button" hidden>다시 불러오기</button>
  <section id="admin" hidden aria-labelledby="admin-title"><div class="section-heading"><h1 id="admin-title">GPS 테스트 설정</h1><a href="/app/gps-test">테스트 화면 열기</a></div>
    <p>일출·일몰과 관계없이 한국 시각으로 지정합니다. 저장된 변경은 새로 시작하는 테스트에 적용되며, 중지는 진행 중인 테스트에도 즉시 적용됩니다.</p>
    <label class="field">편집할 테스트<select id="edit-session"><option value="">새 테스트</option></select></label>
    <form id="config-form"><fieldset class="form-section"><legend>코스와 일정</legend><div class="field-grid">
      <label class="field full">테스트 이름<input name="title" maxlength="100" required></label>
      <label class="field full">코스<select name="group"><option value="walk">1단계 · 탄천 도보 30 스팟</option><option value="bus110a">2단계 · 서울 110A 20 스팟</option><option value="bus520">2단계 · 경기 520 15 스팟</option></select></label>
      <div class="date-shortcuts full"><span>시작·종료 날짜</span><button type="button" class="button" data-day="0">오늘</button><button type="button" class="button" data-day="1">내일</button></div>
      <label class="field">시작 (한국 시각)<input name="startAt" type="datetime-local" required></label>
      <label class="field">종료 (한국 시각)<input name="endAt" type="datetime-local" required></label>
      <label class="field">필수 스팟 수<input name="minimumSpotCheckins" type="number" min="1" max="30" value="10" required><small>출발·도착 제외</small></label>
      <label class="field">체크인 반경 (m)<input name="radius" type="number" min="10" max="200" value="20" required></label>
      <label class="field">GPS 허용 오차 (m)<input name="accuracy" type="number" min="5" max="150" value="35" required></label>
    </div></fieldset>
    <fieldset class="form-section"><legend>출발지·목적지</legend><div id="start-options" class="start-grid"></div><label class="field">도착할 테스트 스팟<select name="finishId" required></select></label></fieldset>
    <label class="review-check"><input type="checkbox" name="enabled" checked>테스트 진행 허용</label>
    <p id="config-message" role="status"></p><button class="button button-primary" type="submit">테스트 설정 저장</button></form>
  </section>
  <section id="runner" hidden aria-label="GPS 테스트">
    <div id="setup"><h1>GPS 현장 테스트</h1><p>테스트 기록은 공식 참가·완주 기록에 포함되지 않습니다.</p><div class="field-grid">
      <label class="field">테스트 선택<select id="session"></select></label><label class="field">출발지<select id="start"></select></label>
    </div><p id="schedule"></p><button id="begin" class="button button-primary">이 설정으로 테스트 시작</button>
    <details id="history"><summary>이전 테스트 이어가기</summary><div id="runs"></div></details></div>
    <div id="active" hidden><div class="section-heading"><h1 id="run-title"></h1><button id="back" class="button">테스트 목록</button></div>
      <p id="progress"></p><p id="run-window" class="muted"></p>
      <div class="gps-layout"><div><div id="test-map" class="gps-map"></div><div class="gps-tools"><button id="locate" class="button">현재 위치 확인</button><button id="nearest" class="button" disabled>가까운 미방문 스팟</button><span id="gps-quality" role="status">위치 확인 전</span></div></div>
      <div class="gps-panel"><label class="field">체크인할 지점<select id="place"></select></label><div class="selected-place"><strong id="place-name"></strong><p id="place-note"></p><a id="external-map" target="_blank" rel="noopener">지도 앱에서 보기</a></div>
      <button id="checkin" class="button button-primary">현재 GPS로 체크인</button><p id="result" role="status" aria-live="polite"></p><button id="retry" class="button" hidden>같은 요청 다시 전송</button>
      <h2>방문 기록</h2><ol id="visits"></ol></div></div>
    </div>
  </section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" ></script>
<script src="/web/shared/map/interaction.js"></script><script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script><script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script><script src="/web/shared/map/map.js"></script><script src="/web/admin/gps.js"></script>
</body></html>
